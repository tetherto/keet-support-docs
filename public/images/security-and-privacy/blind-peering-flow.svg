<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="You, a blind peer, and your friend each hold a copy of the encrypted room. Peers sync whenever they are online together, and members can also sync directly with each other. The blind peer is always online but has no key, so it cannot read what it stores — only members hold the keys.">
  <title>How blind peering keeps a room in sync</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --border: #dce1e8;
      --panel: #ffffff;
      --panel-border: #e2e7ee;
      --fg: #1f2937;
      --muted: #5b6675;
      --line: #8a94a3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12161c;
        --border: #2a323d;
        --panel: #1a2029;
        --panel-border: #2b333e;
        --fg: #e7ebf1;
        --muted: #9aa5b4;
        --line: #7d8794;
      }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  </style>

  <defs>
    <marker id="bp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)" />
    </marker>
  </defs>

  <rect x="1" y="1" width="718" height="258" rx="16" fill="var(--bg)" stroke="var(--border)" />

  <!-- direct member-to-member sync (dashed, over the top) -->
  <path d="M110,98 C 240,30 480,30 610,98" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 5" marker-start="url(#bp-arrow)" marker-end="url(#bp-arrow)" />
  <text x="360" y="34" text-anchor="middle" font-size="11" fill="var(--muted)">can also sync directly when both online</text>

  <!-- You -->
  <rect x="24" y="104" width="152" height="116" rx="14" fill="var(--panel)" stroke="var(--panel-border)" />
  <text x="100" y="134" text-anchor="middle" font-size="16" font-weight="600" fill="var(--fg)">You</text>
  <text x="100" y="156" text-anchor="middle" font-size="11.5" fill="var(--muted)">sometimes online</text>
  <text x="100" y="172" text-anchor="middle" font-size="11.5" fill="var(--muted)">copy of the room</text>
  <text x="100" y="192" text-anchor="middle" font-size="11.5" fill="var(--muted)">has the key</text>
  <circle cx="154" cy="122" r="3.5" fill="none" stroke="#d9a516" stroke-width="2" />
  <path d="M157.5,122 H166 M163,122 v4 M166,122 v5" fill="none" stroke="#d9a516" stroke-width="2" stroke-linecap="round" />

  <!-- Blind peer -->
  <rect x="284" y="104" width="152" height="116" rx="14" fill="var(--panel)" stroke="var(--panel-border)" />
  <text x="360" y="134" text-anchor="middle" font-size="16" font-weight="600" fill="var(--fg)">Blind peer</text>
  <text x="360" y="156" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--fg)">always online</text>
  <text x="360" y="172" text-anchor="middle" font-size="11.5" fill="var(--muted)">copy of the room</text>
  <text x="360" y="192" text-anchor="middle" font-size="11.5" fill="var(--muted)">no key — can't read it</text>
  <path d="M409,116 v-3 a5,5 0 0 1 10,0 v3" fill="none" stroke="#12b886" stroke-width="2" />
  <rect x="405" y="116" width="18" height="13" rx="2.5" fill="#12b886" />
  <circle cx="414" cy="122" r="1.7" fill="var(--panel)" />

  <!-- Your friend -->
  <rect x="544" y="104" width="152" height="116" rx="14" fill="var(--panel)" stroke="var(--panel-border)" />
  <text x="620" y="134" text-anchor="middle" font-size="16" font-weight="600" fill="var(--fg)">Your friend</text>
  <text x="620" y="156" text-anchor="middle" font-size="11.5" fill="var(--muted)">sometimes online</text>
  <text x="620" y="172" text-anchor="middle" font-size="11.5" fill="var(--muted)">copy of the room</text>
  <text x="620" y="192" text-anchor="middle" font-size="11.5" fill="var(--muted)">has the key</text>
  <circle cx="674" cy="122" r="3.5" fill="none" stroke="#d9a516" stroke-width="2" />
  <path d="M677.5,122 H686 M683,122 v4 M686,122 v5" fill="none" stroke="#d9a516" stroke-width="2" stroke-linecap="round" />

  <!-- sync arrows (both directions) -->
  <line x1="182" y1="162" x2="278" y2="162" stroke="var(--line)" stroke-width="2" marker-start="url(#bp-arrow)" marker-end="url(#bp-arrow)" />
  <text x="230" y="148" text-anchor="middle" font-size="11" fill="var(--muted)">sync</text>

  <line x1="442" y1="162" x2="538" y2="162" stroke="var(--line)" stroke-width="2" marker-start="url(#bp-arrow)" marker-end="url(#bp-arrow)" />
  <text x="490" y="148" text-anchor="middle" font-size="11" fill="var(--muted)">sync</text>
</svg>
